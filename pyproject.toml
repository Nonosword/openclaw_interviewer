[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interviewer-skill"
version = "0.8.1"
description = "OpenClaw interview orchestration skill"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pypdf>=5.0.0", "pdfplumber>=0.11.0", "pdfminer.six>=20240706"]

[tool.setuptools.packages.find]
include = ["interviewer*"]
